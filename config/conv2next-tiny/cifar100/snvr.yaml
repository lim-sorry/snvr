DATA:
  DATASET: cifar100
  IMG_SIZE: 32
  BATCH_SIZE: 256
AUG:
  MIXUP: 0.5
  CUTMIX: 0.5
  RANDOM_AUGMENT: TRUE
MODEL:
  TYPE: conv2next-tiny
  NAME: snvr_0.01_1.0
  NUM_CLASSES: 100
  LABEL_SMOOTHING: 0.1
  ESWIN:
    PATCH_SIZE: 1
    EMBED_DIM: 96
    DEPTHS: [2,2,4,2]
    NUM_HEADS: [3,6,12,24]
    WINDOW_SIZE: 4
    MLP_RATIO: 2.0
TRAIN:
  OPTIMIZER:
    NAME: adamwsnvr
    SNVR: [0.01, 1.0]
    DECOUPLE: TRUE
    SEPARATE: TRUE
    SKIP: TRUE
  EPOCHS: 150
  WARMUP_EPOCHS: 5
  WEIGHT_DECAY: 0.05
  BASE_LR: 4e-3
  WARMUP_LR: 1.25e-7
  MIN_LR: 1.25e-6
