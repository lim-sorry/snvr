DATA:
  DATASET: tiny-imagenet
  IMG_SIZE: 64
  BATCH_SIZE: 128
AUG:
  MIXUP: 0.5
  CUTMIX: 0.5
  RANDOM_AUGMENT: TRUE
MODEL:
  TYPE: conv2next-tiny
  NAME: snvr_first
  NUM_CLASSES: 200
  LABEL_SMOOTHING: 0.1
TRAIN:
  OPTIMIZER:
    NAME: adamwsnvr
    SNVR: [0.01, 1.0]
    DECOUPLE: TRUE
    SEPARATE: TRUE
    SKIP: TRUE
    SKIP_FIRST: FALSE
  EPOCHS: 150
  WARMUP_EPOCHS: 5
  WEIGHT_DECAY: 0.05
  BASE_LR: 4e-3
  WARMUP_LR: 1.25e-7
  MIN_LR: 1.25e-6
