DATA:
  DATASET: cifar10
  IMG_SIZE: 32
  BATCH_SIZE: 256
AUG:
  MIXUP: 0.5
  CUTMIX: 0.5
  RANDOM_AUGMENT: TRUE
MODEL:
  TYPE: conv2next-tiny
  NAME: sn
  NUM_CLASSES: 10
  LABEL_SMOOTHING: 0.1
TRAIN:
  OPTIMIZER:
    NAME: adamw
  EPOCHS: 150
  WARMUP_EPOCHS: 5
  WEIGHT_DECAY: 0.05
  BASE_LR: 4e-3
  WARMUP_LR: 1.25e-7
  MIN_LR: 1.25e-6
