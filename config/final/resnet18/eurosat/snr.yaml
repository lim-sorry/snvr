DATA:
  DATASET: eurosat
  IMG_SIZE: 64
  BATCH_SIZE: 128
  SUBSET_RATIO: 1.0
AUG:
  MIXUP: 0.8
  CUTMIX: 1.0
  RANDOM_AUGMENT: false
MODEL:
  TYPE: resnet18
  NAME: snr
  NUM_CLASSES: 10
  LABEL_SMOOTHING: 0.0
TRAIN:
  OPTIMIZER:
    NAME: sgdsnvr
    SNVR:
    - 0.1
    - 0.0
  EPOCHS: 100
  WARMUP_EPOCHS: 0
  WEIGHT_DECAY: 0.0005
  BASE_LR: 0.1
  WARMUP_LR: 1.25e-07
  MIN_LR: 1.25e-06
  EVAL_EVERY: 5
  EVAL_DENSE_FROM: 50
SAVE_CKPT: true
