DATA:
  DATASET: cifar10
  IMG_SIZE: 32
  BATCH_SIZE: 256
AUG:
  MIXUP: 0.8
  CUTMIX: 1.0
  RANDOM_AUGMENT: true
MODEL:
  TYPE: conv2next-tiny
  NAME: wd
  NUM_CLASSES: 10
  LABEL_SMOOTHING: 0.0
TRAIN:
  OPTIMIZER:
    NAME: adamw
  EPOCHS: 100
  WARMUP_EPOCHS: 5
  WEIGHT_DECAY: 0.05
  BASE_LR: 0.01
  WARMUP_LR: 1.25e-07
  MIN_LR: 1.25e-06
SAVE_CKPT: true
