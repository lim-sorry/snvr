DATA:
  DATASET: cifar100
  IMG_SIZE: 32
  BATCH_SIZE: 256
AUG:
  MIXUP: 0.8
  CUTMIX: 1.0
  RANDOM_AUGMENT: false
MODEL:
  TYPE: resnet34
  NAME: war
  NUM_CLASSES: 100
  LABEL_SMOOTHING: 0.0
TRAIN:
  OPTIMIZER:
    NAME: sgd
  EPOCHS: 100
  WARMUP_EPOCHS: 0
  WEIGHT_DECAY: 0.0005
  BASE_LR: 0.1
  WARMUP_LR: 1.25e-07
  MIN_LR: 1.25e-06
  WAR_LAMBDA: 1.0e-05
SAVE_CKPT: true
