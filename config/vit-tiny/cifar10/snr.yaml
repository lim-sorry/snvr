DATA:
  DATASET: cifar10
  IMG_SIZE: 32
  BATCH_SIZE: 256
AUG:
  MIXUP: 0.5
  CUTMIX: 0.5
  RANDOM_AUGMENT: TRUE
MODEL:
  TYPE: vit-tiny
  NAME: snr
  NUM_CLASSES: 10
  PATCH_SIZE: 4
  DROP_PATH_RATE: 0.1
  LABEL_SMOOTHING: 0.1
TRAIN:
  OPTIMIZER:
    NAME: adamwsnvr
    SNVR: [0.01, 0.0]
    DECOUPLE: TRUE
    SEPARATE: TRUE
    SKIP: TRUE
  EPOCHS: 150
  WARMUP_EPOCHS: 10
  WEIGHT_DECAY: 0.05
  BASE_LR: 1e-3
  WARMUP_LR: 1.25e-7
  MIN_LR: 1.25e-6
