DATA:
  DATASET: tiny-imagenet
  IMG_SIZE: 64
  BATCH_SIZE: 128
AUG:
  RANDOM_AUGMENT: FALSE
MODEL:
  TYPE: resnet18
  NAME: snr_0.001
  NUM_CLASSES: 200
  LABEL_SMOOTHING: 0.0
TRAIN:
  OPTIMIZER:
    NAME: sgdsnvr
    SNVR: [0.001, 0.0]
    DECOUPLE: FALSE
    SEPARATE: TRUE
    SKIP: TRUE
  EPOCHS: 150
  WARMUP_EPOCHS: 0
  WEIGHT_DECAY: 0.0005
  BASE_LR: 0.1
  WARMUP_LR: 1.25e-7
  MIN_LR: 1.25e-6